<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--__HEAD__-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
}
/*__THEMES_CSS__*/
html{font-size:clamp(14px, 0.4545vw + 7.2px, 19px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.07rem;line-height:1.5;padding-inline:1.143rem;padding-block:.857rem}
.wrap{max-width:68rem;margin:0 auto;display:flex;flex-direction:column;gap:2rem}
h1,h2{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
header{display:flex;align-items:center;gap:1.143rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:.714rem}
header h1{font-size:1.857rem}
header .controls{margin-inline-start:auto;display:flex;gap:.571rem}
header a.contribute{color:var(--ink-2);font-size:.929rem;text-decoration:none;border:1px solid var(--rule);border-radius:4px;padding:.357rem .714rem;display:inline-flex;align-items:center}
header a.contribute:hover{color:var(--ink)}
header a.contribute:focus-visible{outline:2px solid var(--accent)}
header .prefs{position:relative}
#settings-btn{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:.357rem .714rem;font:inherit;font-size:.929rem;cursor:pointer;display:inline-flex;align-items:center;gap:.357rem}
#settings-btn svg{width:1rem;height:1rem}
#settings-btn:focus-visible{outline:2px solid var(--accent)}
/* settings: the same panel as on a story page, the layout, the language and the theme, under its button */
.settings{position:absolute;top:calc(100% + .429rem);inset-inline-end:0;z-index:8;width:min(24rem,calc(100vw - 2.286rem));display:grid;gap:.857rem;
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:.857rem;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.settings .group{display:grid;gap:.357rem}
.settings .group > span{font-size:.786rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.layouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.429rem}
.layouts button{display:grid;justify-items:center;align-content:start;gap:.286rem;padding:.429rem;font:inherit;font-size:.786rem;line-height:1.25;text-align:center;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;cursor:pointer}
.layouts button svg{width:100%;height:auto;max-width:4.6rem}
.layouts button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layouts button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:900px){ .settings .layout-group{display:none} } /* a phone has one layout */
select#lang,select#theme{width:100%;min-height:max(40px,2.857rem);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:0 .571rem;font:inherit;cursor:pointer}
select#lang:focus-visible,select#theme:focus-visible{outline:2px solid var(--accent)}
.intro{max-width:62ch;color:var(--ink-2);margin:0}
.listbar{display:flex;justify-content:space-between;align-items:center;gap:.857rem;flex-wrap:wrap}
.listbar input{flex:1;max-width:24rem;min-height:max(40px,2.857rem);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:0 .857rem;font:inherit}
.listbar input::placeholder{color:var(--ink-2)}
.listbar input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.rows .empty{padding:1.143rem .571rem;color:var(--ink-2)}
.listbar button,.toggle-all{background:none;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2);font:inherit;font-size:.857rem;padding:.286rem .714rem;cursor:pointer}
.listbar button:hover,.toggle-all:hover{color:var(--ink)}
.listbar button:focus-visible,.toggle-all:focus-visible{outline:2px solid var(--accent)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.row{border-bottom:1px solid var(--rule)}
.row > button{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.286rem 1.143rem;align-items:baseline;width:100%;text-align:start;background:none;border:0;
  color:var(--ink);font:inherit;padding:1rem .571rem;cursor:pointer}
.row > button:hover{background:var(--panel)}
.row > button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .span{grid-column:2;grid-row:1;font-size:.857rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
.row h2{grid-column:3;grid-row:1;font-size:1.429rem;line-height:1.2}
.row .brief{grid-column:2/4;grid-row:2;color:var(--ink-2);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .chev{grid-column:1;grid-row:1/3;align-self:center;width:0;height:0;border:5px solid transparent;border-inline-start:6px solid var(--ink-2);transition:transform .15s}
.row > button[aria-expanded="true"] .chev{transform:rotate(90deg)}
:root[dir="rtl"] .row > button[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.row > button[aria-expanded="true"] .brief{visibility:hidden}
.row .detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1.429rem;padding:0 .571rem 1.286rem}
.row .detail p{margin:0;max-width:62ch}
.row .detail .meta{display:flex;gap:.857rem;font-size:.857rem;color:var(--ink-2);margin-top:.857rem}
.row .detail .open{display:inline-block;margin-top:1rem;background:var(--ink);color:var(--paper);text-decoration:none;padding:.5rem 1rem;border-radius:4px;font-size:1rem}
.row .detail .open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .cover{aspect-ratio:16/10;background:var(--paper-2);border:1px solid var(--rule);display:grid;place-items:center;overflow:hidden}
.row .cover img{width:100%;height:100%;object-fit:cover;display:block}
.credit{font-size:.857rem;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:.714rem}
.credit a{color:inherit}
.row .cover span{font-family:var(--display);font-size:1.571rem;color:var(--ink-2);padding:.857rem;text-align:center}
@media (max-width:640px){
  .row > button{grid-template-columns:auto minmax(0,1fr)}
  .row .span{grid-column:2;grid-row:1}
  .row h2{grid-column:2;grid-row:2}
  .row .brief{grid-column:2;grid-row:3}
  .row .chev{grid-column:1;grid-row:1/4}
  .row .detail{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="controls"><a class="contribute" id="contribute" target="_blank" rel="noopener" hidden></a>
      <div class="prefs">
        <button type="button" id="settings-btn" aria-expanded="false" aria-controls="settings"></button>
        <div class="settings" id="settings" hidden>
          <div class="group layout-group"><span id="layout-label"></span><div class="layouts" id="layouts" role="radiogroup"></div></div>
          <label class="group"><span id="lang-label"></span><select id="lang"></select></label>
          <label class="group"><span id="theme-label"></span><select id="theme"></select></label>
        </div>
      </div>
    </div>
  </header>
  <p class="intro" id="intro"></p>
  <div class="listbar"><input type="search" id="search" autocomplete="off" spellcheck="false"><button type="button" id="toggle-all"></button></div>
  <ul class="rows" id="rows"></ul>
  <footer class="credit" id="credit"></footer>
</div>
<script>
/*__COMMON__*/
const SITE = null;
const S = SITE;
// the language the URL names, else the reader's
let lang = ROUTE?.lang ?? preferredLang(S.languages, S.defaultLanguage);
// a story opens in the main page's language when it has it, else in its own default
const storyLang = s => s.languages.includes(lang) ? lang : s.defaultLanguage;
let palette = pref('palette', S.themes.map(t => t.id), S.defaultTheme);
document.documentElement.dataset.palette = palette;
const L = field => pick(field, lang, S.defaultLanguage);
const open = new Set();
// search: a case insensitive substring of the title in the current language, folded by that language's rules
let query = '';
const visible = () => { const q = query.trim().toLocaleLowerCase(lang); return q ? S.stories.filter(s => L(s.title).toLocaleLowerCase(lang).includes(q)) : S.stories; };
const allOpen = () => visible().every(s => open.has(s.id));
function render(){
  document.documentElement.lang = lang; document.documentElement.dir = S.ui[lang].dir;
  document.title = L(S.title);
  $('title').textContent = L(S.title);
  $('intro').textContent = L(S.intro);
  if (S.repository) { $('contribute').href = S.repository; $('contribute').textContent = S.ui[lang].contribute; $('contribute').hidden = false; }
  fillSelect($('lang'), S.languages.map(l => ({ value: l, text: S.ui[l].name ?? l })), lang, S.ui[lang].language);
  fillSelect($('theme'), S.themes.map(t => ({ value: t.id, text: pick(t.name, lang, S.defaultLanguage, t.id) })), palette, S.ui[lang].theme);
  $('settings-btn').innerHTML = `${S.icons.settings} ${esc(S.ui[lang].settings)}`;
  $('settings').setAttribute('aria-label', S.ui[lang].settings);
  $('lang-label').textContent = S.ui[lang].language; $('theme-label').textContent = S.ui[lang].theme;
  $('layout-label').textContent = S.ui[lang].layout; $('layouts').setAttribute('aria-label', S.ui[lang].layout);
  $('layouts').innerHTML = layoutButtons(S.ui[lang], pref('layout', LAYOUTS, 'center'));
  $('search').placeholder = S.ui[lang].search_stories; $('search').setAttribute('aria-label', S.ui[lang].search_stories);
  $('toggle-all').textContent = toggleLabel(S.ui[lang], allOpen());
  $('credit').innerHTML = credit(S.ui[lang]);
  const shown = visible();
  $('toggle-all').hidden = !shown.length;
  if (!shown.length) { $('rows').innerHTML = `<li class="empty">${esc(S.ui[lang].no_match.replace('{q}', query.trim()))}</li>`; return; }
  $('rows').innerHTML = shown.map((s, i) => `
    <li class="row">
      <button type="button" aria-expanded="${open.has(s.id)}" aria-controls="d-${i}" data-id="${esc(s.id)}">
        <span class="span">${esc(L(s.span))}</span><h2>${esc(L(s.title))}</h2><span class="chev"></span>
        <span class="brief">${esc(L(s.summary))}</span>
      </button>
      <div class="detail" id="d-${i}" ${open.has(s.id) ? '' : 'hidden'}>
        <div>
          <p>${esc(L(s.summary))}</p>
          <div class="meta"><span>${s.pages} ${esc(S.ui[lang].pages)}</span><span>${esc(s.languages.map(l => S.ui[l]?.name ?? l).join(', '))}</span></div>
          <a class="open" href="${storyLink(s.id, storyLang(s))}">${esc(S.ui[lang].open)}</a>
        </div>
        <div class="cover">${s.cover ? `<img src="${esc(s.cover)}" alt="">` : `<span>${esc(L(s.title))}</span>`}</div>
      </div>
    </li>`).join('');
}
$('rows').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  const id = b.dataset.id; open.has(id) ? open.delete(id) : open.add(id);
  b.setAttribute('aria-expanded', open.has(id)); $(b.getAttribute('aria-controls')).hidden = !open.has(id);
  $('toggle-all').textContent = toggleLabel(S.ui[lang], allOpen());
});
$('toggle-all').onclick = () => { const all = allOpen(); visible().forEach(s => all ? open.delete(s.id) : open.add(s.id)); render(); };
$('search').oninput = e => { query = e.target.value; render(); };
$('search').onkeydown = e => { if (e.key === 'Escape' && query) { e.target.value = query = ''; render(); } };
$('theme').onchange = e => { palette = e.target.value; applyPalette(palette); };
const showSettings = open => { $('settings').hidden = !open; $('settings-btn').setAttribute('aria-expanded', open); };
$('settings-btn').onclick = () => showSettings($('settings').hidden);
$('layouts').onclick = e => { const b = e.target.closest('button[data-layout]'); if (b) saveLayout(b.dataset.layout); };
document.addEventListener('click', e => { if (!$('settings').hidden && !e.target.closest('.prefs')) showSettings(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') showSettings(false); });
$('lang').onchange = e => { lang = e.target.value; savePref('lang', lang); setRoute([lang], false); render(); };
render(); setRoute([lang], false);
</script>
</body>
</html>
