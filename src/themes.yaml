# Named colour themes. Each has a light and a dark set of the same tokens.
# A project adds or overrides themes under `themes:` in site.yaml with the same shape.
# Names are interface strings: themes.<id> in src/i18n/<lang>.yaml, or i18n/ui/<lang>.yaml in a project.
# land lists tints for the countries, atlas style; a theme without it paints every country paper2.
cool:
  light: { paper: "#f7f7f5", paper2: "#eef0ea", sea: "#d8e0e6", ink: "#1f2328", ink2: "#5b6470", rule: "#c9cfd6", accent: "#c0392b", panel: "#ffffff", route: "#5b6470", border: "#7a848f",
           land: ["#e6e8d6", "#e2e6ea", "#ece2d6", "#dfe8dc", "#eadfe0", "#e8e4d2"] }
  dark:  { paper: "#15181c", paper2: "#262b31", sea: "#0f1317", ink: "#e6e8eb", ink2: "#9aa3ad", rule: "#3a414a", accent: "#e8655a", panel: "#1c2026", route: "#9aa3ad", border: "#8a949e",
           land: ["#2b3128", "#262d36", "#332c27", "#263229", "#312a2e", "#302f26"] }
mono:
  light: { paper: "#ffffff", paper2: "#f0f0f0", sea: "#e2e2e2", ink: "#111111", ink2: "#666666", rule: "#d0d0d0", accent: "#c8102e", panel: "#fafafa", route: "#666666", border: "#777777" }
  dark:  { paper: "#0e0e0e", paper2: "#232323", sea: "#050505", ink: "#f2f2f2", ink2: "#a0a0a0", rule: "#333333", accent: "#ff4d5e", panel: "#161616", route: "#a0a0a0", border: "#8c8c8c" }
navy:
  light: { paper: "#0f1a2b", paper2: "#c9bda0", sea: "#0b1422", ink: "#f1e9d6", ink2: "#a9b2c2", rule: "#2c3b55", accent: "#f0a04b", panel: "#162339", route: "#a9b2c2", border: "#5c6a80",
           land: ["#c9bda0", "#bfc3a0", "#c7b396", "#b8bfa8", "#cbb8a6", "#c2bb9a"] }
  dark:  { paper: "#0f1a2b", paper2: "#c9bda0", sea: "#0b1422", ink: "#f1e9d6", ink2: "#a9b2c2", rule: "#2c3b55", accent: "#f0a04b", panel: "#162339", route: "#a9b2c2", border: "#5c6a80",
           land: ["#c9bda0", "#bfc3a0", "#c7b396", "#b8bfa8", "#cbb8a6", "#c2bb9a"] }
parchment:
